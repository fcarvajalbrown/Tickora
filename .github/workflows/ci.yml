name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      TICKORA_ADAPTER: software
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa lavapipe
        if: runner.os == 'Linux'
        shell: bash
        env:
          MESA_VERSION: 26.1.3
          CI_BINARY_BUILD: build29
        run: |
          set -e
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq libvulkan1 libllvm18
          curl -L --retry 5 -o mesa.tar.xz "https://github.com/gfx-rs/ci-build/releases/download/$CI_BINARY_BUILD/mesa-$MESA_VERSION-linux-x86_64.tar.xz"
          mkdir mesa
          tar xpf mesa.tar.xz -C mesa
          cat > icd.json <<EOF
          {
            "ICD": {
              "api_version": "1.4.348",
              "library_arch": "64",
              "library_path": "$PWD/mesa/lib/x86_64-linux-gnu/libvulkan_lvp.so"
            },
            "file_format_version": "1.0.1"
          }
          EOF
          find mesa -name 'libvulkan_lvp.so*'
          ldd "$PWD/mesa/lib/x86_64-linux-gnu/libvulkan_lvp.so" | grep -i "not found" || true
          echo "VK_DRIVER_FILES=$PWD/icd.json" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/mesa/lib/x86_64-linux-gnu/:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Python tool tests
        shell: bash
        run: |
          python -m pip install -q -r tools/requirements.txt
          python -I -m unittest discover -s tests/tools -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --release
      - name: Render scenario screenshots
        if: always()
        shell: bash
        run: |
          rm -rf target/ci-shots
          mkdir -p target/ci-shots
          cp -r scenarios target/ci-shots/
          rm -rf target/ci-shots/scenarios/goldens
          cargo run -q --release -p tickora-mcp -- scenario --record target/ci-shots/scenarios/arena.json target/ci-shots/scenarios/lighting.json target/ci-shots/scenarios/lighting-second-room.pending.json
      - name: Upload scenario screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-shots-${{ runner.os }}
          path: target/ci-shots/scenarios/goldens
